# Full stack on one server:  cp .env.example .env  (set ANTHROPIC_API_KEY)  &&  docker compose up -d --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: studio
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio12345}
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set s http://minio:9000 $${S3_ACCESS_KEY:-minio} $${S3_SECRET_KEY:-minio12345}; do sleep 2; done;
             mc mb -p s/$${S3_BUCKET:-studio}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio12345}
      S3_BUCKET: ${S3_BUCKET:-studio}

  migrate:
    build: { context: ., target: worker }
    depends_on: { postgres: { condition: service_healthy } }
    working_dir: /app/packages/db
    command: ["npx", "tsx", "src/migrate.ts"]
    environment: &env
      DATABASE_URL: postgresql://studio:${POSTGRES_PASSWORD:-studio}@postgres:5432/studio
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL_SMART: ${AI_MODEL_SMART:-claude-sonnet-5-5}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-claude-haiku-5-5}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-studio}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio12345}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET (openssl rand -hex 32)}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      STACKEXCHANGE_KEY: ${STACKEXCHANGE_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    ports: ["3000:3000"]
    environment: *env

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    environment:
      <<: *env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes: [models:/models]

volumes:
  pgdata:
  miniodata:
  models:
